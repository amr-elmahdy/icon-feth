name: Fetch Icons from theSVG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout icon-fetcher
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone theSVG repository
        run: |
          git clone --depth 1 https://github.com/glincker/thesvg.git /tmp/thesvg

      - name: Run fetch script
        env:
          THESVG_DIR: /tmp/thesvg
        run: node fetch-icons.js

      - name: Commit and push icons + logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons/ logs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update icons and logs from theSVG"
            git push
          fi